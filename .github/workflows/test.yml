name: Testing CI
on: pull_request
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node:
          - 18
          - 26
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run enable
      - name: Put reslop on PATH
        run: node scripts/github-path.js
      # Starting a process is slow on Windows, and a scan of each git and
      # node process is most of that cost. The runner temp disk is faster
      # than the default one.
      - name: Windows, scan exclusions
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionProcess node.exe, git.exe, npm.cmd
      - name: Test
        run: npm test
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
